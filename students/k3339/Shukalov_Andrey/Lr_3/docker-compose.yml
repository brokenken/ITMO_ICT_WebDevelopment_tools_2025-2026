services:
  db:
    image: postgres:17-alpine
    container_name: lr3-db

    environment:
      POSTGRES_DB: time_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-parsed-pages.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d time_manager"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7-alpine
    container_name: lr3-redis

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


  parser:
    build:
      context: ./parser

    container_name: lr3-parser

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: time_manager
      DB_USER: postgres
      DB_PASSWORD: postgres

    ports:
      - "8001:8001"

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"
        ]
      interval: 5s
      timeout: 3s
      retries: 10


  api:
    build:
      context: ./api

    container_name: lr3-api

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/time_manager

      JWT_SECRET_KEY: lab3-development-jwt-secret-key-1234567890

      ACCESS_TOKEN_EXPIRE_MINUTES: 60

      PARSER_URL: http://parser:8001

      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

      parser:
        condition: service_healthy

    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      "


  celery_worker:
    build:
      context: ./api

    container_name: lr3-celery-worker

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/time_manager

      JWT_SECRET_KEY: lab3-development-jwt-secret-key-1234567890

      PARSER_URL: http://parser:8001

      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

    depends_on:
      redis:
        condition: service_healthy

      parser:
        condition: service_healthy

    command:
      [
        "celery",
        "-A",
        "app.celery_app.celery_app",
        "worker",
        "--loglevel=info"
      ]


volumes:
  postgres_data: